<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Microsoft 웨비나 추천 가이드</title>
  <style>
    :root{
      --ms-blue:#0078D4; --ms-blue-hover:#106EBE; --bg:#F5F5F5; --line:#E5E7EB; --muted:#6B7280; --text:#111827;
      --green:#107C10; --orange:#F7630C; --purple:#7A3DB8;
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",Arial,sans-serif}
    header{background:#fff;border-bottom:1px solid #ddd} .wrap{max-width:1400px;margin:0 auto;padding:0 32px}
    .top{height:65px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:2px}.logo span:nth-child(1){background:#F25022}.logo span:nth-child(2){background:#7FBA00}.logo span:nth-child(3){background:#00A4EF}.logo span:nth-child(4){background:#FFB900}
    h1{font-size:20px;margin:0;font-weight:650}.sub{font-size:13px;color:var(--muted)} main{padding:24px 0 36px}.lead{font-size:14px;color:#4B5563;margin:0 0 20px;line-height:1.6}.legend{display:flex;gap:12px;flex-wrap:wrap}.legend span{font-size:12px;color:#555}.dot{font-size:11px;margin-right:4px}.copilot{color:#F7630C}.cloud{color:#107C10}.security{color:#0078D4}
    .board{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .grid{display:grid;grid-template-columns:280px repeat(3,minmax(0,1fr))}.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:130px}.cell:nth-child(4n){border-right:none}.head,.journey{background:#FAFAFA}.head{padding:17px 16px;text-align:center;min-height:auto}.head:first-child{text-align:left;padding-left:24px;display:flex;align-items:center;color:var(--ms-blue);font-weight:650;font-size:14px}.lvl{font-size:14px;font-weight:750}.lvl-desc{font-size:12px;margin-top:2px}.lv100{color:#16823A}.lv200{color:#D15F00}.lv300{color:#7A3DB8}
    .journey{padding:22px 24px;display:flex;align-items:center;gap:12px}.icon{width:40px;height:40px;border-radius:999px;background:var(--ms-blue);color:white;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}.j-title{font-size:14px;font-weight:650;margin:0 0 6px}.j-desc{font-size:12px;color:var(--muted);line-height:1.45;margin:0}.sessions{padding:18px 20px;display:flex;flex-direction:column;gap:10px}.session{width:100%;appearance:none;border:0;background:transparent;border-radius:8px;padding:8px;text-align:left;cursor:pointer;transition:.14s}.session:hover{background:#EFF6FF;transform:scale(1.01)}.s-row{display:flex;gap:7px;align-items:flex-start}.s-dot{font-size:9px;line-height:1.4}.s-title{font-size:13px;line-height:1.35;color:#111827}.session:hover .s-title{color:var(--ms-blue)}.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px}.date{font-size:10px;color:#6B7280}.aud{font-size:10px;color:#4B5563;background:#F3F4F6;border-radius:4px;padding:2px 6px}.empty{font-size:12px;color:#A1A1AA;padding:10px 8px}
    .foot{margin-top:12px;text-align:center;font-size:12px;color:var(--muted)}
    dialog{border:0;border-radius:14px;padding:0;width:min(760px,calc(100vw - 32px));box-shadow:0 24px 70px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(17,24,39,.52)}.modal{background:white}.m-head{padding:24px 28px 18px;border-bottom:1px solid #F0F0F0;display:flex;gap:12px;align-items:flex-start}.badge{border:1px solid;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap}.b100{background:#F0FDF4;color:#15803D;border-color:#BBF7D0}.b200{background:#FFF7ED;color:#C2410C;border-color:#FED7AA}.b300{background:#FAF5FF;color:#7E22CE;border-color:#E9D5FF}.m-title{font-size:20px;line-height:1.35;margin:0;font-weight:650}.m-body{padding:22px 28px 24px}.info{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}.label{font-size:12px;color:var(--muted);font-weight:650;margin-bottom:5px}.value{font-size:14px}.section{margin-top:20px}.section h3{font-size:14px;margin:0 0 10px}.desc{font-size:14px;color:#374151;line-height:1.75;white-space:pre-line}.actions{display:flex;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid #F0F0F0}.btn{height:40px;border-radius:8px;border:1px solid #D1D5DB;background:white;color:#374151;font-weight:650;padding:0 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--ms-blue);border-color:var(--ms-blue);color:white;flex:1}.btn.primary:hover{background:var(--ms-blue-hover)}.url{font-size:12px;color:var(--ms-blue);word-break:break-all}.err{background:#fff3cd;border:1px solid #ffe08a;padding:16px;border-radius:8px;color:#664d03}
    @media(max-width:900px){.wrap{padding:0 16px}.top{height:auto;padding:16px 0;align-items:flex-start;flex-direction:column}.grid{display:block}.cell{border-right:none}.head:not(:first-child){display:none}.head:first-child{display:none}.journey{border-top:1px solid var(--line)}.sessions{min-height:auto}.sessions:before{content:attr(data-level);font-size:12px;font-weight:750;margin:0 0 4px}.info{grid-template-columns:1fr}.m-head,.m-body{padding-left:20px;padding-right:20px}}
  </style>
</head>
<body>
<header><div class="wrap top"><div class="brand"><div class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></div><h1>Microsoft 웨비나 추천 가이드</h1></div><div class="legend"><span><b class="dot copilot">●</b>Copilot</span><span><b class="dot cloud">●</b>Cloud & AI</span><span><b class="dot security">●</b>Security</span></div></div></header>
<main class="wrap"><p class="lead">관심 분야와 원하는 단계에 맞는 웨비나를 확인하고 등록해보세요.</p><div id="app"></div><p class="foot">세션을 클릭하면 상세 설명과 등록 링크를 확인할 수 있습니다.</p></main>
<dialog id="modal"><div class="modal"><div class="m-head"><div id="mBadge" class="badge"></div><h2 id="mTitle" class="m-title"></h2></div><div class="m-body"><div class="info"><div><div class="label">일시</div><div id="mDate" class="value"></div></div><div><div class="label">학습 여정</div><div id="mJourney" class="value"></div></div><div><div class="label">카테고리</div><div id="mCategory" class="value"></div></div><div><div class="label">대상</div><div id="mAudience" class="value"></div></div></div><div class="section"><h3>설명</h3><div id="mDesc" class="desc"></div></div><div class="section"><h3>등록 링크</h3><a id="mUrl" class="url" target="_blank" rel="noopener noreferrer"></a></div><div class="actions"><button class="btn" id="closeBtn">닫기</button><a class="btn primary" id="registerBtn" target="_blank" rel="noopener noreferrer">지금 등록</a></div></div></div></dialog>
<script>
const JOURNEYS=['AI 시작하기','업무에 쓰는 AI 에이전트','운영 및 관리하기'];
const LEVELS=[100,200,300];
const JOURNEY_DESC={
 'AI 시작하기':'AI와 Copilot을 이해하고 업무에 활용하는 첫 단계',
 '업무에 쓰는 AI 에이전트':'AI 에이전트를 활용한 업무 생산성 향상 방법',
 '운영 및 관리하기':'보안, 거버넌스, 관리 체계를 구축하는 단계'
};
const JOURNEY_ICON={'AI 시작하기':'✨','업무에 쓰는 AI 에이전트':'⚙️','운영 및 관리하기':'🛡️'};
const LEVEL_LABEL={100:'입문',200:'기본',300:'심화'};
const CATEGORY_CLASS={'Copilot':'copilot','Cloud & AI':'cloud','Security':'security'};
function escapeHtml(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function render(sessions){
 const app=document.getElementById('app');
 const grid=document.createElement('div'); grid.className='board';
 const inner=document.createElement('div'); inner.className='grid';
 inner.innerHTML=`<div class="cell head">Customer Journey</div>`+LEVELS.map(l=>`<div class="cell head"><div><div class="lvl lv${l}">Level ${l}</div><div class="lvl-desc lv${l}">${LEVEL_LABEL[l]}</div></div></div>`).join('');
 JOURNEYS.forEach(j=>{
  inner.insertAdjacentHTML('beforeend',`<div class="cell journey"><div class="icon">${JOURNEY_ICON[j]}</div><div><p class="j-title">${escapeHtml(j)}</p><p class="j-desc">${escapeHtml(JOURNEY_DESC[j])}</p></div></div>`);
  LEVELS.forEach(l=>{
   const cell=document.createElement('div'); cell.className='cell sessions'; cell.dataset.level=`Level ${l} · ${LEVEL_LABEL[l]}`;
   const list=sessions.filter(s=>s.journey===j && Number(s.level)===l);
   if(!list.length){cell.innerHTML='<div class="empty">등록된 세션 없음</div>'}
   list.forEach(s=>{
    const btn=document.createElement('button'); btn.className='session'; btn.type='button';
    btn.innerHTML=`<div class="s-row"><span class="s-dot ${CATEGORY_CLASS[s.category]||''}">●</span><div><div class="s-title">${escapeHtml(s.title)}</div><div class="meta"><span class="date">${escapeHtml(s.dateTime||'')}</span>${Array.isArray(s.targetAudiences)&&s.targetAudiences.length?`<span class="aud">${escapeHtml(s.targetAudiences.join(', '))}</span>`:''}</div></div></div>`;
    btn.addEventListener('click',()=>openModal(s)); cell.appendChild(btn);
   });
   inner.appendChild(cell);
  });
 });
 grid.appendChild(inner); app.replaceChildren(grid);
}
function openModal(s){
 const modal=document.getElementById('modal');
 const badge=document.getElementById('mBadge'); badge.className=`badge b${Number(s.level)||100}`; badge.textContent=`Level ${s.level||''}`;
 document.getElementById('mTitle').textContent=s.title||'';
 document.getElementById('mDate').textContent=s.dateTime||'-';
 document.getElementById('mJourney').textContent=s.journey||'-';
 document.getElementById('mCategory').textContent=s.category||'-';
 document.getElementById('mAudience').textContent=Array.isArray(s.targetAudiences)&&s.targetAudiences.length?s.targetAudiences.join(', '):'-';
 document.getElementById('mDesc').textContent=s.description||'-';
 const url=s.registrationUrl||''; const urlEl=document.getElementById('mUrl'); const reg=document.getElementById('registerBtn');
 if(url){urlEl.textContent=url; urlEl.href=url; reg.href=url; reg.style.display='inline-flex';} else {urlEl.textContent='등록 링크가 제공되지 않았습니다'; urlEl.removeAttribute('href'); reg.style.display='none';}
 modal.showModal();
}
document.getElementById('closeBtn').addEventListener('click',()=>document.getElementById('modal').close());
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.close();});
fetch('webinar-sessions.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('JSON load failed');return r.json();}).then(data=>render(Array.isArray(data)?data:[])).catch(()=>{document.getElementById('app').innerHTML='<div class="err">webinar-sessions.json 파일을 불러오지 못했습니다. index.html과 같은 폴더에 있는지 확인하세요.</div>';});
</script>
</body>
</html>
